<header>

  <nav class="tabs" aria-label="화면 전환">

<script>
/* ===== 설정: Supabase (시연용 합성 데이터 전용) =====
   publishable 키는 공개되어도 되는 키이지만, 이 프로젝트의 wf_ 테이블은 시연용으로 누구나 읽고 쓸 수 있게 열려 있다.
   실제 개인정보를 넣지 말 것. 행정망 안에서는 외부 클라우드를 쓸 수 없으므로 내부 DB로 이전해야 한다. */
const SUPABASE_URL = 'https://naptmidzrudyezlegtgz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8fv7f3vSQoDK67lsflICeA__wgFlpCa';
const ME = { ref: 'citizen-0001', name: '홍길동(합성)', birth: '1980-01-01', phone: '010-****-5678', email: 'hong***@example.com', consent: { sms: true, email: true } };
const WRONG_MSG = '첨부한 서류가 해당 서류와 맞지 않습니다. 올바른 서류를 첨부해 주세요.';
const KIND = { manual: '현장 작성', gov24: '정부24 연계', upload: '직접 첨부' };
/* AI Double Check 판독 엔진 (welfare_ai/src/server.py). 켜져 있으면 파일 내용을 실제로 판독하고,
   꺼져 있으면 기존 시연 방식(파일 이름 키워드)으로 동작한다. */
const ENGINE_URL = 'http://127.0.0.1:8787';
const ROLE_SEQ = { '접수': 0, '심사': 1, '승인': 2 };
const SEV = { high: ['red', '높음'], medium: ['amber', '중간'], low: ['', '낮음'], info: ['', '참고'] };

async function api(path, opt) {
  opt = opt || {};
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: opt.method || 'GET',
    headers: Object.assign({ apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=representation' }, opt.headers || {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  if (!res.ok) { throw new Error('DB 오류 ' + res.status + ': ' + (await res.text()).slice(0, 200)); }
  return res.status === 204 ? null : res.json();
}
async function engine(path, body) {
  const res = await fetch(ENGINE_URL + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('판독 엔진 오류 ' + res.status));
  return j;
}
async function checkEngine() {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(ENGINE_URL + '/api/health', { signal: ctl.signal }); clearTimeout(t);
    S.engine = r.ok ? await r.json() : false;
  } catch (e) { S.engine = false; }
}
const toB64 = (file) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(new Error('파일을 읽지 못했습니다.')); r.readAsDataURL(file); });
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (t) => { if (!t) return '-'; const d = new Date(t); if (isNaN(d)) return '-'; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const $ = (id) => document.getElementById(id);

const S = {
  role: 'citizen', step: 'list', cat: '전체', procId: null, dept: null,
  procs: [], pdocs: {}, cases: [], openId: null, toast: '', busy: false,
  att: {}, attCount: {}, attMsg: {}, modal: null, engine: false
};

/* ===== 데이터 ===== */
async function loadAll() {
  const [procs, pdocs, cases, lines] = await Promise.all([
    api('wf_procedures?select=*&order=sort'),
    api('wf_proc_docs?select=*&order=sort'),
    api('wf_cases?select=*,wf_case_docs(*)&order=created_at.desc'),
    api('wf_approval_line?select=*&order=seq')
  ]);
  S.lines = {};
  lines.forEach((l) => { (S.lines[l.proc_id] = S.lines[l.proc_id] || []).push(l); });
  S.procs = procs;
  S.pdocs = {};
  pdocs.forEach((d) => { (S.pdocs[d.proc_id] = S.pdocs[d.proc_id] || []).push(d); });
  S.cases = cases;
  if (!S.dept) S.dept = procs[0] ? procs[0].dept : null;
}
const proc = (id) => S.procs.find((p) => p.id === id);
const depts = () => Array.from(new Set(S.procs.map((p) => p.dept)));
const nonManual = (pid) => (S.pdocs[pid] || []).filter((d) => d.kind !== 'manual');
const avgOf = (arr) => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;

function computeReasons(blind, docs, defs) {
  const r = [];
  if (blind) r.push(blind);
  const mism = docs.filter((d) => d.state === 'mismatch');
  if (mism.length) r.push('정부24 대조 불일치: ' + mism.map((d) => (defs.find((x) => x.doc_id === d.doc_id) || {}).name).join(', '));
  const avg = avgOf(docs.map((d) => d.sim || 0));
  const low = docs.filter((d) => (d.sim || 0) < 80).map((d) => (defs.find((x) => x.doc_id === d.doc_id) || {}).name);
  if (docs.length && avg < 80) r.push('서류 불일치 의심: ' + low.join(', '));
  return { reasons: r, avg: avg };
}
const group = (c) => (c.status === '완료' || c.status === '반려') ? 'done' : (c.reasons && c.reasons.length ? 'review' : 'fit');
const statusChip = (c, forCitizen) => {
  const m = { '접수': 'blue', '체크완료': 'blue', 'AI심사': 'amber', 'VALI오류': 'red', '완료': 'green', '반려': 'red' };
  return '<span class="chip ' + (forCitizen && c.status === 'VALI오류' ? 'amber' : (m[c.status] || '')) + '">' + esc(c.status === 'AI심사' ? '심사중' : c.status === 'VALI오류' ? (forCitizen ? '최종 심사중' : '오류') : c.status) + '</span>';
};


/* ===== 신청 도우미 챗봇 (시연용: 규칙 기반 답변, 실제 문자·메일은 발송되지 않음) ===== */
S.bot = { open: false, msgs: [], seen: {}, unread: 0 };
const BOT_AV = '<svg class="bot-av" viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><line x1="32" y1="6" x2="32" y2="14" stroke="#0B2A5B" stroke-width="3" stroke-linecap="round"/><circle class="ant" cx="32" cy="5" r="4" fill="#F59E0B"/><rect x="10" y="14" width="44" height="36" rx="14" fill="#256EF4"/><rect x="16" y="21" width="32" height="22" rx="10" fill="#fff"/><g class="eyes"><ellipse cx="25" cy="31" rx="3" ry="4" fill="#0B2A5B"/><ellipse cx="39" cy="31" rx="3" ry="4" fill="#0B2A5B"/></g><path d="M26 38 Q32 43 38 38" stroke="#0B2A5B" stroke-width="2.5" fill="none" stroke-linecap="round"/><g class="wave"><circle cx="54" cy="46" r="5" fill="#256EF4"/></g></svg>';
function botSay(text, chips) { S.bot.msgs.push({ from: 'bot', text: text, chips: chips || null }); if (!S.bot.open) S.bot.unread++; }
function botMe(text) { S.bot.msgs.push({ from: 'me', text: text }); }
function docLines(pid) { return (S.pdocs[pid] || []).map((d) => '• ' + d.name + ' (' + d.req + ' · ' + KIND[d.kind] + ')').join('\n'); }
function sendChips() {
  const c = ME.consent; const ch = [];
  if (c.sms) ch.push({ k: 'sms', t: '문자(SMS)로 받기' });
  if (c.email) ch.push({ k: 'mail', t: '이메일로 받기' });
  if (ch.length) ch.push({ k: 'no', t: '괜찮아요' });
  return ch;
}
function botOnGuide(pid) {
  if (S.bot.seen[pid]) return;
  S.bot.seen[pid] = 1; const p = proc(pid);
  botSay('안녕하세요, 신청 도우미예요. “' + p.name + '” 신청에 필요한 서류를 알려드릴게요.\n' + docLines(pid));
  if (ME.consent.sms || ME.consent.email) botSay('수신 동의하신 방법으로 이 서류 안내를 보내드릴까요? 원하시는 방법을 골라 주세요.', sendChips());
  else botSay('문자·이메일 수신 동의가 없어 발송은 어려워요. 화면의 안내를 확인해 주세요.');
  S.bot.open = true; S.bot.unread = 0;
}
async function botSend(kind) {
  const p = proc(S.procId);
  botMe(kind === 'sms' ? '문자(SMS)로 받기' : '이메일로 받기');
  if (!p) { botSay('먼저 신청할 서비스를 골라 주세요.'); return; }
  if (!(kind === 'sms' ? ME.consent.sms : ME.consent.email)) { botSay('해당 방법은 수신 동의가 없어 보낼 수 없어요.'); return; }
  try { await api('wf_view_log', { method: 'POST', body: { case_id: null, doc_id: '*', dept: (kind === 'sms' ? 'SMS' : '이메일') + ' 안내 발송(시연): ' + p.id }, headers: { Prefer: 'return=minimal' } }); } catch (e) {}
  botSay((kind === 'sms' ? '문자(' + ME.phone + ')' : '이메일(' + ME.email + ')') + '로 “' + p.name + '” 필요 서류 안내를 보냈어요. (시연용이라 실제 발송은 되지 않아요.)');
}
function botAnswer(t) {
  const p = S.procId ? proc(S.procId) : null;
  if (/문자|sms|메일|이메일|발송|보내/i.test(t)) { botSay('어떤 방법으로 받으시겠어요?', sendChips().length ? sendChips() : null); if (!sendChips().length) botSay('수신 동의가 없어 발송은 어려워요.'); return; }
  if (/발급|어디|어떻게/.test(t)) { if (!p) return botSay('먼저 신청할 서비스를 골라 주세요.'); botSay('서류별 준비 방법이에요.\n' + (S.pdocs[p.id] || []).map((d) => '• ' + d.name + ': ' + (d.kind === 'gov24' ? '정부24 연계로 자동 확인돼요' : d.kind === 'upload' ? '직접 발급받아 파일로 첨부해 주세요' : '주민센터·기관을 방문해 작성해요')).join('\n')); return; }
  if (/서류|필요|준비/.test(t)) { if (!p) return botSay('먼저 신청할 서비스를 골라 주세요.'); botSay('“' + p.name + '” 필요 서류예요.\n' + docLines(p.id)); return; }
  if (/대리|위임/.test(t)) { botSay('대리 신청은 위임장, 본인 의사 확인서, 가족관계 확인 서류가 필요해요. (시연 안내)'); return; }

/* AI Double Check 점검 결과: 결재선 단계(A 접수 · B 심사 · C 승인)별로 나눠, 지금 단계를 강조한다 */
function dcPanel(c) {
  const line = (S.lines && S.lines[c.proc_id]) || [];
  const fs = c.findings.filter((f) => f.severity !== 'low' && f.severity !== 'info');
  const low = c.findings.length - fs.length;
  const now = c.stage || 0;
  const stages = [0, 1, 2].map((i) => {
    const mine = fs.filter((f) => (f.stage_seq != null ? f.stage_seq : ROLE_SEQ[f.role]) === i);
    const l = line[i] || { label: '결재자 ' + 'ABC'[i], dept: '' };
    return '<div class="dc-stage' + (i === now && c.status !== '완료' && c.status !== '반려' ? ' now' : '') + '"><b>' + esc(l.label) + ' · ' + ['접수', '심사', '승인'][i] + '</b> <span class="muted">' + esc(l.dept) + '</span> ' +
      (mine.length ? '<span class="chip red">확인 ' + mine.length + '건</span>' : '<span class="chip green">확인 사항 없음</span>') +
      mine.map((f) => '<div class="dc-item"><span class="chip ' + (SEV[f.severity] || SEV.info)[0] + '">' + (SEV[f.severity] || SEV.info)[1] + '</span> <b>' + esc(f.title) + '</b><div class="muted">' + esc(f.detail) + '</div>' +
        (f.evidence || []).slice(0, 2).map((e) => '<div class="dc-ev">근거 · ' + esc(e.doc) + ' · ' + esc(e.field) + ': “' + esc(e.excerpt) + '”</div>').join('') +
        (f.gov ? '<div class="dc-ev">원본 · ' + esc(f.gov.source) + ': ' + esc(f.gov.value) + '</div>' : '') +
        (f.action ? '<div class="muted" style="margin-top:2px">조치: ' + esc(f.action) + '</div>' : '') + '</div>').join('') + '</div>';
  }).join('');
  return '<div class="dc"><div class="dc-head">AI Double Check 점검 결과 <span class="chip">' + fs.length + '건</span>' + (low ? '<span style="font-weight:400">· 참고 ' + low + '건(현장 작성 서류 등) 생략</span>' : '') + '</div>' + stages + '</div>';
}

/* ===== 동작 ===== */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function run(fn) {
  try { await fn(); } catch (e) { S.toast = String(e.message || e); }
  render();
}
async function refresh() { await loadAll(); }
async function patch(id, body) { await api('wf_cases?id=eq.' + encodeURIComponent(id), { method: 'PATCH', body: Object.assign({ updated_at: new Date().toISOString() }, body) }); }

async function attachFile(docId, file) {
  const p = proc(S.procId); const d = (S.pdocs[p.id] || []).find((x) => x.doc_id === docId);
  if (S.engine) {
    S.attMsg[docId] = '판독 중…'; render();
    try {
      const data = await toB64(file);
      const r = await engine('/api/check-doc', { proc_id: p.id, doc_id: docId, filename: file.name, data: data });
      S.att[docId] = { fname: file.name, sim: r.sim, state: r.state, data: data };
      S.attMsg[docId] = r.state === 'wrong' ? WRONG_MSG + (r.detected_type ? ' (판독 결과: ' + r.detected_type + ')' : '') :
        (r.suspicious && r.suspicious.length ? '서류 안에 판독을 조작하려는 듯한 문장이 있어 담당자가 확인합니다.' : '');
    } catch (e) { S.att[docId] = null; S.attMsg[docId] = e.message; }
    return;
  }
  const fname = file.name; const hit = (d.keys || []).some((k) => fname.indexOf(k) >= 0);
  S.attCount[docId] = (S.attCount[docId] || 0) + 1;
  let sim, state, msg = '';
  if (!hit) { sim = 28; state = 'wrong'; msg = WRONG_MSG; }
  else if (d.kind === 'gov24' && d.diff && S.attCount[docId] === 1) { sim = d.good; state = 'mismatch'; msg = '정부24 연계 값과 다릅니다: ' + d.diff + ' 같은 서류를 다시 첨부하면 확인을 이어갑니다.'; }
  else { sim = d.good; state = 'ok'; }
  S.att[docId] = { fname, sim, state }; S.attMsg[docId] = msg;
}

function findingReasons(fs) {
  return fs.filter((f) => f.severity === 'high' || f.severity === 'medium').map((f) => '[' + f.role + '] ' + f.title);
}
async function insertCase(body) {
  try { await api('wf_cases', { method: 'POST', body: body }); }
  catch (e) {  // DB에 findings 칸이 아직 없으면(002 마이그레이션 전) 결과 없이 저장하고 알린다
    if (body.findings && /findings/.test(e.message)) { const b = Object.assign({}, body); delete b.findings; await api('wf_cases', { method: 'POST', body: b }); S.noFindingsCol = true; }
    else throw e;
  }
}
async function submitCase() {
  const p = proc(S.procId); const need = nonManual(p.id);
  S.busy = true; render();
  if (S.engine) {
    const docs = {}; need.forEach((d) => { const a = S.att[d.doc_id]; if (a && a.data) docs[d.doc_id] = { filename: a.fname, data: a.data }; });
    let res;
    try { res = await engine('/api/check-case', { proc_id: p.id, docs: docs }); } finally { S.busy = false; }
    const rows = need.map((d) => ({ doc_id: d.doc_id, sim: (res.docs[d.doc_id] || {}).sim || 0, state: (res.docs[d.doc_id] || {}).state || 'missing', fname: S.att[d.doc_id] ? S.att[d.doc_id].fname : null }));
    const id = 'app_' + Date.now().toString(36);
    await insertCase({ id: id, proc_id: p.id, applicant_name: ME.name, applicant_ref: ME.ref, birth: ME.birth, form_name: p.form_name, blind: '', avg: avgOf(rows.map((x) => x.sim)), reasons: findingReasons(res.findings), findings: res.findings });
    await api('wf_case_docs', { method: 'POST', body: rows.map((x) => Object.assign({ case_id: id }, x)) });
    S.att = {}; S.attCount = {}; S.attMsg = {}; S.step = 'mine'; S.myOpen = id;
    S.toast = '기안이 제출되었습니다. 서류 점검 결과는 담당자가 확인합니다.' + (S.noFindingsCol ? ' (DB에 점검 결과 칸이 없어 요약만 저장했습니다: sql/002 적용 필요)' : '');
    await refresh(); return;
  }
  const rows = need.map((d) => ({ doc_id: d.doc_id, sim: S.att[d.doc_id].sim, state: S.att[d.doc_id].state === 'mismatch' ? 'mismatch' : 'ok', fname: S.att[d.doc_id].fname }));
  const r = computeReasons('', rows, need);
  const id = 'app_' + Date.now().toString(36);
  await api('wf_cases', { method: 'POST', body: { id: id, proc_id: p.id, applicant_name: ME.name, applicant_ref: ME.ref, birth: ME.birth, form_name: p.form_name, blind: '', avg: r.avg, reasons: r.reasons } });
  await api('wf_case_docs', { method: 'POST', body: rows.map((x) => Object.assign({ case_id: id }, x)) });
  S.att = {}; S.attCount = {}; S.attMsg = {}; S.busy = false; S.step = 'mine'; S.myOpen = id;
  S.toast = '기안이 제출되었습니다. 진행 상태는 “내 신청함”에서 확인할 수 있습니다.';
  await refresh();
}

async function approve(id) {
  await patch(id, { status: 'AI심사', stage: 2 }); await refresh(); render();
  await sleep(1300);
  const c = S.cases.find((x) => x.id === id);
  await patch(id, { status: c && c.typo ? 'VALI오류' : '완료', stage: 2 }); await refresh();
}

async function saveForm(id) {
  const name = $('f-name').value.trim(); const birth = $('f-birth').value; const blind = $('f-blind').value.trim();
  if (!name) { S.formErr = '기안자 성명을 입력하세요.'; return; }
  if (!birth) { S.formErr = '생년월일을 입력하세요.'; return; }
  S.formErr = '';
  if (id) {
    const c = S.cases.find((x) => x.id === id);
    const r = computeReasons(blind, c.wf_case_docs || [], S.pdocs[c.proc_id] || []);
    await patch(id, { applicant_name: name, birth: birth, blind: blind, reasons: r.reasons, avg: r.avg });
  } else {
    const pid = $('f-form').value; const p = proc(pid); const low = $('f-low') && $('f-low').checked;
    const need = nonManual(pid); const rows = need.map((d) => ({ doc_id: d.doc_id, sim: low ? 58 : 95, state: low ? 'wrong' : 'ok' }));
    const r = computeReasons(blind, rows, need);
    const nid = 'reg_' + Date.now().toString(36);
    await api('wf_cases', { method: 'POST', body: { id: nid, proc_id: pid, applicant_name: name, applicant_ref: 'registered', birth: birth, form_name: p.form_name, blind: blind, avg: r.avg, reasons: r.reasons } });
    await api('wf_case_docs', { method: 'POST', body: rows.map((x) => Object.assign({ case_id: nid }, x)) });
  }
  S.modal = null; S.toast = '저장되었습니다.'; await refresh();
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT') return;
  const a = t.dataset.act, v = t.dataset.v;
  S.toast = '';
  if (a === 'role') { S.role = v; render(); }
  else if (a === 'cat') { S.cat = v; render(); }
  else if (a === 'home') { S.step = 'list'; render(); }

  else if (a === 'reload') run(refresh);

  else if (a === 'mreset') { S.fs = ''; S.fe = ''; S.fq = ''; S.af = { s: '', e: '', q: '' }; S.myOpen = null; render(); }
  else if (a === 'guide') { ev.preventDefault(); S.procId = v; S.step = 'guide'; botOnGuide(v); S.recent = [v].concat((S.recent || []).filter((x) => x !== v)).slice(0, 5); render(); }
  else if (a === 'botopen') { S.bot.open = true; S.bot.unread = 0; render(); }
  else if (a === 'botclose') { S.bot.open = false; render(); }
  else if (a === 'botconsent') { ME.consent[v] = !ME.consent[v]; render(); }
  else if (a === 'botsend') { const i = $('bot-in'); const t = i ? i.value.trim() : ''; if (t) { botMe(t); i.value = ''; botAnswer(t); } render(); }
  else if (a === 'botchip') {
    if (v === 'sms' || v === 'mail') run(() => botSend(v === 'sms' ? 'sms' : 'mail'));
    else if (v === 'no') { botMe('괜찮아요'); botSay('알겠어요. 필요하면 언제든 불러 주세요.'); render(); }
    else { const q = { docs: '필요한 서류', where: '서류 발급 방법', status: '진행 상태 확인' }[v]; botMe(q); botAnswer(q); render(); }
  }
  else if (a === 'search') { S.q = ($('q-input') || {}).value || ''; render(); }
  else if (a === 'sort') { S.sort = v; render(); }
  else if (a === 'apply') { S.att = {}; S.attCount = {}; S.attMsg = {}; S.step = 'apply'; render(); }
  else if (a === 'submit') run(submitCase);
  else if (a === 'dept') { S.dept = v; S.openId = null; render(); }
  else if (a === 'detail') { S.openId = S.openId === v ? null : v; render(); }
  else if (a === 'batch') run(async () => {
    const targets = S.cases.filter((c) => S.procs.some((p) => p.id === c.proc_id && p.dept === S.dept) && c.status === '접수');
    for (const c of targets) await patch(c.id, { status: '체크완료', stage: 1 });
    S.toast = '일괄체크 완료: ' + targets.length + '건을 점검했습니다. 사각지대·서류 오류가 있는 건은 “검토 필요”에 남습니다.'; await refresh();
  });
  else if (a === 'approve') run(() => approve(v));
  else if (a === 'reject') run(async () => { await patch(v, { status: '반려' }); await refresh(); });
  else if (a === 'revali') run(async () => { await patch(v, { typo: null, status: '완료' }); S.toast = '수정 후 재검증을 통과했습니다.'; await refresh(); });
  else if (a === 'new') { S.formErr = ''; S.modal = { type: 'new' }; render(); }
  else if (a === 'edit') { S.formErr = ''; S.modal = { type: 'edit', id: v }; render(); }
  else if (a === 'del') { const c = S.cases.find((x) => x.id === v); S.modal = { type: 'del', id: v, name: c.applicant_name + ' · ' + c.form_name }; render(); }
  else if (a === 'delok') run(async () => { await api('wf_cases?id=eq.' + encodeURIComponent(v), { method: 'DELETE' }); S.modal = null; S.openId = null; S.toast = '삭제되었습니다.'; await refresh(); });
  else if (a === 'save') run(() => saveForm(v));
  else if (a === 'close') { S.modal = null; render(); }
  else if (a === 'view') {
    const cid = t.dataset.c; S.modal = { type: 'view', c: cid, d: v }; render();
    api('wf_view_log', { method: 'POST', body: { case_id: cid, doc_id: v, dept: S.dept }, headers: { Prefer: 'return=minimal' } }).catch(() => {});
  }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'lim') { S.limit = parseInt(ev.target.value, 10); render(); return; }
  const t = ev.target; if (t.dataset && t.dataset.act === 'file' && t.files[0]) { attachFile(t.dataset.v, t.files[0]).then(render); }
});
document.addEventListener('keydown', (ev) => { if (ev.target && ev.target.id === 'q-input' && ev.key === 'Enter') { S.q = ev.target.value; render(); return; } if (ev.target && ev.target.id === 'bot-in' && ev.key === 'Enter') { const t = ev.target.value.trim(); if (t) { botMe(t); ev.target.value = ''; botAnswer(t); render(); } return; } if (S.modal && S.modal.type === 'view' && (ev.ctrlKey || ev.metaKey) && /^[cpsa]$/i.test(ev.key)) ev.preventDefault(); });
document.addEventListener('copy', (ev) => { if (S.modal && S.modal.type === 'view') ev.preventDefault(); });

(async function init() {
  await checkEngine();
  try { await loadAll(); } catch (e) { $('app').innerHTML = '<div class="notice err">DB에 연결하지 못했습니다. ' + esc(e.message) + '</div>'; return; }
  render();
})();
</script>
